[project]
name = "inversedjt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "yfinance>=0.2",
    "scipy>=1.12",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "lxml>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
